<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>나의 취미 노트</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="뒤로가기" hidden>‹</button>
    <h1 id="title">나의 취미 노트</h1>
  </header>

  <main id="app">
    <!-- 홈 화면 -->
    <section class="view" id="home">
      <div class="profile">
        <div class="avatar">🌿</div>
        <div>
          <p class="hello">안녕하세요 👋</p>
          <p class="intro">좋아하는 것들을 차곡차곡<br>모아둔 작은 공간이에요.</p>
        </div>
      </div>
      <div id="categories"></div>
    </section>

    <!-- 하위 메뉴 화면 -->
    <section class="view" id="detail" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar"></nav>

  <script src="script.js"></script>
</body>
</html>
